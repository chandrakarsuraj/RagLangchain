[project]
name = "raglangchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chandrakarsuraj", email = "sun003light@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.5",
    "langchain-openai>=1.8.5",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.2.1,<4.0",
    "langgraph-sdk>=0.4.14,<1.0",
    "python-dotenv>=1.2.4",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "rich>=15.0.0",
    "langchain-text-splitters>=1.2.0",
    "chroma>=0.2.0",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "boto3>=1.44.12",
    "glassflow-rius>=1.6.0",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
    "alembic>=1.16.0",
    "langchain-pinecone>=0.2.13",
    "langchain-postgres>=0.0.19",
    "langgraph-cli[inmem]>=0.4.44",
    "streamlit>=1.67.0",
    "requests>=2.32.0",
    "firebase>=4.0.1",
    "firebase-admin>=7.8.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agents"
